name: "Terraform Deploy"
on:
  push:
    branches:
      - main


jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - action: Repository Checkout
        uses: actions/checkout@v3
      - action: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: |
          cd terraform-folder
          terraform init
      - name: Terraform Init
        run: |
          cd terraform-folder
          terraform init
      - name: Terraform Plan
        run: cd terraform-folder && terraform plan
      - name: Terraform Apply
        run: cd terraform-folder && terraform apply


