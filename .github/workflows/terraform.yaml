name: "Terraform Deploy"
on:
  push:
    branches:
      - main


jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v3
        with: 
          fetch-depth: 1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Terraform Init
        run: |
          cd terraform-folder
          terraform init
      - name: Terraform Init
        run: |
          cd terraform-folder
          terraform init
      - name: Terraform Plan
        run: cd terraform-folder && terraform plan
      - name: Terraform Apply
        run: cd terraform-folder && terraform apply


